<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>__LEAFLET_CSS__</style>
<style>
:root{--ink:#1d2b38;--navy:#13293d;--muted:#5b6b7a;--line:#dbe3ea;--accent:#0b5d95;--accent-strong:#094a77;--accent-soft:#e8f1f8;--surface-alt:#f0f3f6;--radius:8px;--shadow:0 1px 2px rgba(16,32,48,.06),0 1px 3px rgba(16,32,48,.04)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(280px,1fr);gap:16px}
#map{height:660px;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column}
h2{margin:0 0 2px;font-size:17px;color:var(--navy);font-weight:700}
.stat{margin:14px 0 4px;padding:12px 14px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid #b9d4ea}
.stat span{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-strong)}
#count{margin:2px 0 0;font-size:15px;font-weight:600;color:var(--navy)}
label{display:block;margin-top:16px;margin-bottom:7px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:inherit;font:inherit;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}input:disabled{cursor:default;opacity:.4}
output{float:right;font-size:14px;font-weight:700;color:var(--accent-strong);text-transform:none;letter-spacing:0}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.muted{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.notes{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
#empty,#unmapped{color:#8a5a0b;font-size:12.5px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month-disabled{opacity:.5}
.leaflet-container{font:13px system-ui,sans-serif}
.leaflet-tooltip{border-color:var(--line);border-radius:6px;box-shadow:0 3px 12px #25374718;line-height:1.45}
@media(max-width:820px){.layout{grid-template-columns:1fr}#map{height:440px}.panel{padding:14px}}
</style><script>__LEAFLET_JS__</script></head><body>
<main class="layout"><div id="map" aria-label="Carte des incendies en France"></div><aside class="panel" aria-label="Filtres des incendies">
<h2>Filtrer les incendies</h2><p id="coverage" class="muted"></p>
<div class="stat"><span>Sélection</span><p id="count" aria-live="polite"></p></div><p id="empty" hidden>Aucun incendie ne correspond aux filtres sélectionnés.</p>
<label for="year">Année <output id="year-value"></output></label><input type="range" id="year" step="1"><div class="ends"><span id="first-year"></span><span id="last-year"></span></div>
<label for="period">Incendies affichés</label><select id="period"><option value="year">Toute l’année sélectionnée</option><option value="month">Mois sélectionné</option></select>
<div id="month-controls"><label for="month">Mois <output id="month-value"></output></label><input type="range" id="month" min="1" max="12" step="1" value="12"><div class="ends"><span>Janvier</span><span>Décembre</span></div></div>
<div class="row"><div><label for="season">Saison</label><select id="season"><option value="all">Toutes</option><option>Hiver</option><option>Printemps</option><option>Été</option><option>Automne</option></select></div>
<div><label for="cause">Cause</label><select id="cause"><option value="all">Toutes</option><option value="accidentelle">Accidentelle</option><option value="malveillance">Malveillance</option><option value="naturelle">Foudre (naturelle)</option></select></div></div>
<div class="notes"><p class="muted">Cercles proportionnels à la surface brûlée, placés au centre de la commune : ils ne représentent pas les périmètres des feux.</p><p id="approximate" class="muted"></p><p id="unmapped"></p></div>
</aside></main>
<script>__LOGIC_JS__</script><script>const records=__RECORDS__;
__APP_JS__</script></body></html>
