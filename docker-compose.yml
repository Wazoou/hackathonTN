# Pyro-Watch : docker compose up --build  ->  dashboard sur http://localhost:8501
# Vrai modèle : mettre DETECTOR=yolo dans le fichier .env (voir .env.example)
# Caméras : images réelles du dataset pyro-sdis, coordonnées approximatives (à ajuster).

x-camera: &camera
  build:
    context: ./camera
    args:
      INSTALL_YOLO: ${INSTALL_YOLO:-false}
  environment: &camera-env
    API_URL: http://api:8000
    INTERVAL: ${INTERVAL:-5}
    DETECTOR: ${DETECTOR:-dummy}
    YOLO_WEIGHTS: ${YOLO_WEIGHTS:-hf://pyronear/yolo11s_sensitive-detector/best.pt}
  volumes:
    - ./data/samples:/samples:ro,z   # ",z" : obligatoire avec SELinux (Fedora)
    - ./.cache/hf:/root/.cache/huggingface:z   # le modèle n'est téléchargé qu'une fois
  depends_on: [api]
  restart: unless-stopped

services:
  api:
    build: ./api
    ports: ["8000:8000"]     # doc interactive : http://localhost:8000/docs
    volumes:
      - ./data/api:/data:z
    environment:
      CONF_THRESHOLD: "0.35"
      MIN_CONSECUTIVE: "2"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
      ARCHIVE_DIR: /archives
      RISK_DIR: /risk
      FIRE_DATA_PATH: /incendies/Incendies.csv
      BDIFF_DIR: /bdiff
      WEATHER_PUBLIC_URL: ${WEATHER_PUBLIC_URL:-/app/static/weather/current.json}
    volumes:
      - ./archives-data:/archives:ro,z
      - ${RISK_DATA_DIR:-./risk-data}:/risk:ro,z
      - ./ifm_plus/data/raw/incendies:/incendies:ro,z
      - ./ifm_plus/data/raw/manual/bdiff:/bdiff:ro,z
      - ${WEATHER_DATA_DIR:-./data/weather}/public:/app/static/weather:ro,z
    depends_on: [api]
    restart: unless-stopped

  weather:
    build:
      context: .
      dockerfile: weather/Dockerfile
    environment:
      MF_DATA_DIR: /meteo-mf
    volumes:
      - ${RISK_DATA_DIR:-./risk-data}:/risk:ro,z
      - ${WEATHER_DATA_DIR:-./data/weather}:/weather:z
      - ./ifm_plus/data/raw/meteo:/meteo-mf:ro,z
    restart: unless-stopped

  cam-1:
    <<: *camera
    environment:
      <<: *camera-env
      CAMERA_ID: cam-1
      CAMERA_NAME: Brison 110° (SDIS 07)
      CAMERA_LAT: "44.53"
      CAMERA_LON: "4.22"
      SOURCE: /samples/cam-1     # python ml/pyro_sdis.py samples --out data/samples

  cam-2:
    <<: *camera
    environment:
      <<: *camera-env
      CAMERA_ID: cam-2
      CAMERA_NAME: Ferion 142° (Force 06)
      CAMERA_LAT: "43.85"
      CAMERA_LON: "7.20"
      SOURCE: /samples/cam-2

  cam-3:
    <<: *camera
    environment:
      <<: *camera-env
      CAMERA_ID: cam-3
      CAMERA_NAME: Caméra de test (synthétique)
      CAMERA_LAT: "44.90"
      CAMERA_LON: "4.40"
      SOURCE: synthetic          # ou une URL de webcam publique / un .mp4 / rtsp://...
